[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/zhangweijian/object-storage-manager"

[workspace.dependencies]
# --- UI（macOS Only，GPUI 固定栈，见 agents.md §3）---
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"

# --- 基础 ---
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 时间格式化（gpui-component 已传递依赖 chrono 0.4，仅显式声明用其 Local/clock）
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# --- 网络（spec §68：reqwest + rustls；tokio 异步运行时）---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
# 流式下载/上传的 Stream 迭代（reqwest bytes_stream 需要；只用 std 特性，零运行时依赖）
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"

# --- macOS 原生 / 持久化 ---
security-framework = "3"
security-framework-sys = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
# 有序去重集合（对象多选：⌘Click 增删 + ⇧Click 范围 + ⌘A 全选，保持点击顺序）
indexmap = "2"

# --- 内部 crate ---
object-storage-desktop = { path = "crates/desktop" }
object-storage-app = { path = "crates/app" }
object-storage-domain = { path = "crates/domain" }
object-storage-core = { path = "crates/storage-core" }
object-storage-qiniu = { path = "crates/provider-qiniu" }
object-storage-aliyun = { path = "crates/provider-aliyun" }
object-storage-transfer = { path = "crates/transfer" }
object-storage-persistence = { path = "crates/persistence" }
object-storage-macos = { path = "crates/macos" }
object-storage-preview = { path = "crates/preview" }
object-storage-ui = { path = "crates/ui" }
object-storage-common = { path = "crates/common" }

[profile.release]
lto = "thin"
strip = "symbols"
